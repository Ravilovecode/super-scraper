# Render Blueprint — deploys the Super Scraper dashboard as a web service.
# The dashboard launches super_scraper.py as a managed subprocess, so this one
# service runs both the UI and the scraper.
#
# After deploy: open the service URL, upload a CSV, press Start.
services:
  - type: web
    name: super-scraper
    runtime: python
    plan: free                       # upgrade to "starter" so long scrapes aren't killed by spin-down
    buildCommand: pip install -r requirements.txt
    startCommand: python dashboard.py --out out
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY          # set the value in the Render dashboard (kept secret, not in git)
        sync: false
